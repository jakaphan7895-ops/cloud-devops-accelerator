apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  annotations:
    # บังคับให้พอร์ต HTTP (80) วิ่งไป HTTPS (443) อัตโนมัติ
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - todo.local
    secretName: todo-tls-secret # อ้างอิง Secret ที่เราสร้างใน Step 2
  rules:
  - host: todo.local
    http:
      paths:
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: node-user-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-frontend-service
            port:
              number: 5000