apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
    ##nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: todo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-service
            port:
              number: 5000
      - path: /api/user
        pathType: Prefix
        backend:
          service:
            name: node-user-service
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-service
            port:
              number: 5000